name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build
        run: make all

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build with ASan + UBSan
        run: make clean && make CFLAGS="-Wall -Wextra -O1 -g -fsanitize=address,undefined" \
                                LDFLAGS="-lcrypto -fsanitize=address,undefined" all

      - name: Unit tests under sanitizers
        run: make test-unit

      - name: Integration tests under sanitizers
        run: bash test_sequence.sh
